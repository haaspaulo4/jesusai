<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>JesusAI Companion Pet</title>
<!-- Carrega Socket.IO para comunicação realtime com o backend do JesusAI -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --accent-color: #c084fc;
    --accent-rgb: 192, 132, 252;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
  }
  #container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #pet-wrapper {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 200px;
    height: 200px;
    z-index: 10;
  }
  canvas {
    width: 200px;
    height: 200px;
    position: absolute;
    top: 0; left: 0;
    cursor: grab;
  }
  #mic-btn {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid rgba(var(--accent-rgb), 0.4);
    background: rgba(20, 0, 40, 0.85);
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
  }
  #mic-btn:hover {
    border-color: rgba(var(--accent-rgb), 0.8);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.3);
    transform: scale(1.1);
  }
  #mic-btn.active {
    border-color: #0f0;
    background: rgba(0, 255, 0, 0.15);
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
    animation: mic-pulse 1.5s ease-in-out infinite;
  }
  #mic-btn svg { width: 16px; height: 16px; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(0,255,0,0.3); }
    50% { box-shadow: 0 0 20px rgba(0,255,0,0.6); }
  }

  /* Novo botão de chat */
  #chat-toggle-btn {
    position: absolute;
    bottom: 18px;
    right: 56px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid rgba(var(--accent-rgb), 0.4);
    background: rgba(20, 0, 40, 0.85);
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(5px);
  }
  #chat-toggle-btn:hover {
    border-color: rgba(var(--accent-rgb), 0.8);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.3);
    transform: scale(1.1);
  }
  #chat-toggle-btn.active {
    border-color: #00e4ff;
    background: rgba(0, 228, 255, 0.15);
    box-shadow: 0 0 15px rgba(0, 228, 255, 0.4);
  }
  #chat-toggle-btn svg { width: 14px; height: 14px; }

  #tooltip {
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 0, 40, 0.92);
    color: var(--accent-color);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 9px;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid rgba(var(--accent-rgb), 0.4);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 10;
  }
  #pet-wrapper:hover #tooltip { opacity: 1; }

  /* Estilos do Chat Box Holográfico */
  #chat-box {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 360px;
    height: 410px;
    background: rgba(15, 5, 25, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(var(--accent-rgb), 0.35);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(var(--accent-rgb), 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 5;
    opacity: 0;
    transform: scale(0.9) translateY(10px);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  #chat-box.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }
  #chat-header {
    padding: 12px 16px;
    background: rgba(30, 10, 50, 0.6);
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #chat-header h3 {
    color: var(--accent-color);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(var(--accent-rgb), 0.5);
  }
  #chat-messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(var(--accent-rgb), 0.3) transparent;
  }
  #chat-messages::-webkit-scrollbar {
    width: 4px;
  }
  #chat-messages::-webkit-scrollbar-thumb {
    background: rgba(var(--accent-rgb), 0.3);
    border-radius: 2px;
  }
  .msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 12px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 11.5px;
    line-height: 1.4;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: rgba(147, 51, 234, 0.25);
    color: #f3e8ff;
    border: 1px solid rgba(147, 51, 234, 0.4);
    border-bottom-right-radius: 2px;
  }
  .msg.jarvis {
    align-self: flex-start;
    background: rgba(30, 20, 50, 0.55);
    color: #e9d5ff;
    border: 1px solid rgba(var(--accent-rgb), 0.25);
    border-bottom-left-radius: 2px;
  }
  #chat-input-area {
    padding: 10px;
    background: rgba(20, 5, 30, 0.8);
    border-top: 1px solid rgba(var(--accent-rgb), 0.15);
    display: flex;
    gap: 6px;
  }
  #chat-input-area input {
    flex: 1;
    background: rgba(10, 2, 20, 0.6);
    border: 1px solid rgba(var(--accent-rgb), 0.25);
    border-radius: 8px;
    padding: 8px 12px;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    font-size: 11px;
    outline: none;
    transition: border-color 0.3s;
  }
  #chat-input-area input:focus {
    border-color: rgba(var(--accent-rgb), 0.6);
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.2);
  }
  #chat-input-area button {
    background: var(--accent-color);
    border: none;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  #chat-input-area button:hover {
    background: #d8b4fe;
    transform: scale(1.05);
  }
  #chat-input-area button svg {
    width: 14px;
    height: 14px;
    stroke: #120024;
    stroke-width: 2;
  }
</style>
</head>
<body>
<div id="container">
  
  <!-- Chat Box acoplado -->
  <div id="chat-box">
    <div id="chat-header">
      <h3>COMPANION CLASSIC</h3>
    </div>
    <div id="chat-messages">
      <div class="msg jarvis" id="chat-welcome-msg">Às suas ordens. Em que posso ajudar?</div>
    </div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Digite uma instrução..." autocomplete="off">
      <button id="chat-send-btn" title="Enviar Mensagem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Pet Wrapper (sempre visível no canto) -->
  <div id="pet-wrapper">
    <canvas id="zeus" width="400" height="400"></canvas>
    
    <!-- Botão microfone original -->
    <button id="mic-btn" title="Ativar Companion (Voz + Cowork)">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <!-- Novo botão para abrir chat -->
    <button id="chat-toggle-btn" title="Abrir Chat Box">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>

    <div id="tooltip">Companion — Conectando...</div>
  </div>
</div>

<script>
const canvas = document.getElementById('zeus');
const W = 400, H = 400;

// Initialize Three.js WebGL Renderer with Alpha (Transparency)
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Add Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 2.2, 15);
pointLight.position.set(0, 0, 0);
scene.add(pointLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);

// 3D States matching the companion's emotional/cognitive states
const STATES_3D = {
  idle:      { color: 0xc084fc, speed: 0.8, scale: 1.0, amplitude: 0.08, particleSpeed: 0.2 },
  listening: { color: 0x00f2fe, speed: 2.2, scale: 1.15, amplitude: 0.18, particleSpeed: 0.7 },
  thinking:  { color: 0xffd000, speed: 3.5, scale: 1.22, amplitude: 0.28, particleSpeed: 1.2 },
  speaking:  { color: 0xfb7185, speed: 2.4, scale: 1.18, amplitude: 0.22, particleSpeed: 0.8 },
  excited:   { color: 0xf43f5e, speed: 4.2, scale: 1.32, amplitude: 0.38, particleSpeed: 2.0 },
  frustrated:{ color: 0xef4444, speed: 3.6, scale: 1.22, amplitude: 0.32, particleSpeed: 1.4 },
  curious:   { color: 0x10b981, speed: 1.4, scale: 1.05, amplitude: 0.12, particleSpeed: 0.4 }
};

let currentState = 'idle';

// Create 3D Meshes representing the Cognitive Energy Core (neural sphere)
const coreGroup = new THREE.Group();
scene.add(coreGroup);

// Curated Glassmorphic / Glossy glowing Brain Material (MeshPhongMaterial with high shininess)
const coreMaterial = new THREE.MeshPhongMaterial({
  color: 0xc084fc,
  emissive: 0x3b0764,
  shininess: 120,
  specular: 0xffffff,
  transparent: true,
  opacity: 0.72,
  side: THREE.DoubleSide,
  flatShading: false
});

// Holographic cyber cortex wireframe material
const wireMaterial = new THREE.MeshBasicMaterial({
  color: 0xc084fc,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});

// Helper function to procedurally generate a highly detailed and realistic brain hemisphere geometry
function createHemiGeometry() {
  const geom = new THREE.SphereGeometry(1.0, 48, 48);
  const pos = geom.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    
    // Elongate along Z (front-back), scale down on X and Y slightly to make it hemisphere-shaped
    v.z *= 1.35;
    v.x *= 0.85;
    v.y *= 0.95;
    
    // Brain lobes shaping:
    // Frontal lobe is slightly larger/bulbous, occipital is slightly narrower
    if (v.z < 0) {
      // Occipital lobe (back of brain)
      v.x *= 0.9;
      v.y *= 0.85;
    } else {
      // Frontal lobe (front of brain)
      v.y *= 1.05;
    }
    
    // Procedural brain wrinkles (gyri and sulci)
    // Multiscale trigonometric noise to generate brain fold geometry
    const wrinkle = Math.sin(v.x * 6.5) * Math.cos(v.y * 6.5) * Math.sin(v.z * 6.5) * 0.12 +
                    Math.sin(v.x * 12.0) * Math.cos(v.y * 12.0) * Math.sin(v.z * 12.0) * 0.04 +
                    Math.cos(v.z * 4.0) * 0.05;
                     
    v.addScaledVector(v.clone().normalize(), wrinkle);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geom.computeVertexNormals();
  return geom;
}

// Generate the high-definition hemisphere geometry
const hemiGeom = createHemiGeometry();

// Left Hemisphere
const leftHemi = new THREE.Mesh(hemiGeom, coreMaterial);
leftHemi.position.x = -0.32;
coreGroup.add(leftHemi);

// Right Hemisphere
const rightHemi = new THREE.Mesh(hemiGeom, coreMaterial);
rightHemi.position.x = 0.32;
coreGroup.add(rightHemi);

// Helper function to generate a tight-wrinkled cerebellum geometry (biological folia)
function createCerebellumGeometry() {
  const geom = new THREE.SphereGeometry(0.45, 32, 32);
  const pos = geom.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    v.z *= 0.8; // Flatten Z slightly
    const wrinkle = Math.sin(v.x * 15.0) * Math.cos(v.y * 15.0) * Math.sin(v.z * 15.0) * 0.04;
    v.addScaledVector(v.clone().normalize(), wrinkle);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geom.computeVertexNormals();
  return geom;
}

// Cerebellum Left & Right (rear bottom parts of the brain)
const cerebGeom = createCerebellumGeometry();
const leftCereb = new THREE.Mesh(cerebGeom, coreMaterial);
leftCereb.position.set(-0.25, -0.62, -0.45);
coreGroup.add(leftCereb);

const rightCereb = new THREE.Mesh(cerebGeom, coreMaterial);
rightCereb.position.set(0.25, -0.62, -0.45);
coreGroup.add(rightCereb);

// Brain Stem (connecting bottom)
const stemGeom = new THREE.CylinderGeometry(0.18, 0.12, 0.7, 16, 16);
// Bend stem slightly backwards dynamically
const stemPos = stemGeom.attributes.position;
const sv = new THREE.Vector3();
for (let i = 0; i < stemPos.count; i++) {
  sv.fromBufferAttribute(stemPos, i);
  sv.z += (sv.y - 0.35) * 0.15;
  stemPos.setXYZ(i, sv.x, sv.y, sv.z);
}
stemGeom.computeVertexNormals();
const stem = new THREE.Mesh(stemGeom, coreMaterial);
stem.position.set(0, -0.85, -0.2);
coreGroup.add(stem);

// Glowing outer digital wireframe "cortex cage"
const leftHemiWire = new THREE.Mesh(hemiGeom, wireMaterial);
leftHemiWire.position.x = -0.32;
leftHemiWire.scale.setScalar(1.05);
coreGroup.add(leftHemiWire);

const rightHemiWire = new THREE.Mesh(hemiGeom, wireMaterial);
rightHemiWire.position.x = 0.32;
rightHemiWire.scale.setScalar(1.05);
coreGroup.add(rightHemiWire);

// Glowing Orbital Hologram Rings (Neural Pathways)
const ringMaterial = new THREE.MeshBasicMaterial({
  color: 0xc084fc,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.22,
  wireframe: true
});

const rings = [];
const ringGeom = new THREE.TorusGeometry(2.3, 0.015, 8, 48); // Thinner and slightly larger for elegance

const ring1 = new THREE.Mesh(ringGeom, ringMaterial);
ring1.rotation.x = Math.PI / 4;
scene.add(ring1);
rings.push(ring1);

const ring2 = new THREE.Mesh(ringGeom, ringMaterial);
ring2.rotation.y = Math.PI / 4;
scene.add(ring2);
rings.push(ring2);

// Surrounding Holographic Particle Swarm (Firing Synapses)
const particleGeom = new THREE.BufferGeometry();
const particleCount = 100; // Increased count for richer synaptic representation
const particlePositions = new Float32Array(particleCount * 3);
const particleSpeeds = [];

for (let i = 0; i < particleCount; i++) {
  // Generate random particles nestled around the brain hemispheres
  const isLeft = Math.random() > 0.5;
  const rx = (isLeft ? -0.32 : 0.32) + (Math.random() - 0.5) * 1.5;
  const ry = (Math.random() - 0.5) * 1.6 - 0.2;
  const rz = (Math.random() - 0.5) * 1.8;
  
  particlePositions[i*3] = rx;
  particlePositions[i*3+1] = ry;
  particlePositions[i*3+2] = rz;
  
  particleSpeeds.push({
    baseX: rx,
    baseY: ry,
    baseZ: rz,
    rangeX: 0.25 + Math.random() * 0.2,
    rangeY: 0.25 + Math.random() * 0.2,
    rangeZ: 0.25 + Math.random() * 0.2,
    speedFactor: 0.8 + Math.random() * 0.6
  });
}

particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMaterial = new THREE.PointsMaterial({
  color: 0xc084fc,
  size: 0.07,
  transparent: true,
  opacity: 0.65,
  sizeAttenuation: true
});
const particles = new THREE.Points(particleGeom, particleMaterial);
scene.add(particles);

// Dynamic lerping variables for smooth animation transitions
let currentSpeed = STATES_3D.idle.speed;
let currentScale = STATES_3D.idle.scale;
let currentAmplitude = STATES_3D.idle.amplitude;
let currentColor = new THREE.Color(STATES_3D.idle.color);

const clock = new THREE.Clock();

function draw() {
  requestAnimationFrame(draw);
  
  const elapsed = clock.getElapsedTime();
  
  // Dynamic smooth lerp transitions
  const target = STATES_3D[currentState] || STATES_3D.idle;
  currentSpeed += (target.speed - currentSpeed) * 0.08;
  currentScale += (target.scale - currentScale) * 0.08;
  currentAmplitude += (target.amplitude - currentAmplitude) * 0.08;
  
  currentColor.lerp(new THREE.Color(target.color), 0.08);
  
  // Apply visual parameters
  coreMaterial.color.copy(currentColor);
  coreMaterial.emissive.copy(currentColor).multiplyScalar(0.35);
  wireMaterial.color.copy(currentColor);
  ringMaterial.color.copy(currentColor);
  particleMaterial.color.copy(currentColor);
  pointLight.color.copy(currentColor);
  
  // Animate brain wireframes with a glowing thought pulse (cyber cortex cage)
  const wirePulse = 1.04 + Math.sin(elapsed * currentSpeed * 2.5) * 0.015 * currentAmplitude;
  leftHemiWire.scale.setScalar(wirePulse);
  rightHemiWire.scale.setScalar(wirePulse);
  
  leftHemiWire.rotation.y = elapsed * 0.05 * currentSpeed;
  rightHemiWire.rotation.y = -elapsed * 0.05 * currentSpeed;
  
  // Rotate energy groups (Brain)
  coreGroup.rotation.y = elapsed * currentSpeed * 0.22;
  coreGroup.rotation.x = elapsed * currentSpeed * 0.1;
  
  // Organic cognitive breathing animation of the core brain hemispheres
  const breathScale = 1.0 + Math.sin(elapsed * currentSpeed * 2.0) * 0.035 * currentAmplitude;
  coreGroup.scale.setScalar(currentScale * breathScale);
  
  // Rotate orbital neural rings
  ring1.rotation.x = elapsed * currentSpeed * 0.18;
  ring1.rotation.y = elapsed * currentSpeed * 0.28;
  ring2.rotation.y = -elapsed * currentSpeed * 0.22;
  ring2.rotation.z = elapsed * currentSpeed * 0.12;
  
  // Orbit/Pulse particles (Firing Synapses)
  const partAttr = particleGeom.attributes.position;
  const pSpeedFactor = target.particleSpeed;
  const time = elapsed * 4.0 * pSpeedFactor;
  
  for (let i = 0; i < particleCount; i++) {
    const s = particleSpeeds[i];
    const offsetX = Math.sin(time * s.speedFactor + i) * s.rangeX * 0.25;
    const offsetY = Math.cos(time * 0.8 * s.speedFactor + i) * s.rangeY * 0.25;
    const offsetZ = Math.sin(time * 1.2 * s.speedFactor + i) * s.rangeZ * 0.25;
    
    partAttr.setXYZ(i, s.baseX + offsetX, s.baseY + offsetY, s.baseZ + offsetZ);
  }
  partAttr.needsUpdate = true;
  particles.rotation.y = elapsed * 0.06;
  
  renderer.render(scene, camera);
}

draw();

// === Estado de Persona Dinâmico ===
let currentPersonaId = 'jesus';
let currentPersonaName = 'Companion';
let currentVoice = 'pm_alex';
let currentLang = 'pt-BR';
let currentWelcomeTitle = 'Companion Classic';
let currentWelcomeBody = 'Às suas ordens. Em que posso ajudar?';
let currentAccentColor = '#c084fc';

// Helper para converter Hex para RGB para a variável --accent-rgb
function hexToRgb(hex) {
  const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
  const fullHex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(fullHex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : null;
}

function updateThemeColor(hexColor) {
  const rgb = hexToRgb(hexColor);
  if (rgb) {
    document.documentElement.style.setProperty('--accent-color', hexColor);
    document.documentElement.style.setProperty('--accent-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
  }
}

// === Status polling inicial via Bridge Electron ===
const tooltip = document.getElementById('tooltip');

async function pollStatus() {
  try {
    const res = await fetch('http://localhost:3000/api/pet/status');
    if (res.ok) {
      const data = await res.json();
      currentPersonaId = data.personaId;
      currentPersonaName = data.name;
      currentVoice = data.ttsVoice;
      currentLang = data.ttsLang === 'p' ? 'pt-BR' : (data.ttsLang === 'e' ? 'en-US' : (data.ttsLang === 's' ? 'es-ES' : 'pt-BR'));
      currentWelcomeTitle = data.welcomeTitle;
      currentWelcomeBody = data.welcomeBody;
      currentAccentColor = data.accentColor || '#c084fc';

      // Atualiza textos na interface
      const headerTitle = document.querySelector('#chat-header h3');
      if (headerTitle) {
        headerTitle.textContent = `${currentPersonaName.toUpperCase()} CLASSIC CO-COMPANION`;
      }
      
      const welcomeMsg = document.getElementById('chat-welcome-msg');
      if (welcomeMsg && welcomeMsg.textContent === 'Às suas ordens. Em que posso ajudar?' && currentWelcomeBody) {
        welcomeMsg.textContent = currentWelcomeBody;
      }

      const micBtn = document.getElementById('mic-btn');
      if (micBtn) {
        micBtn.setAttribute('title', `Ativar ${currentPersonaName} (Voz + Cowork)`);
      }

      const chatToggle = document.getElementById('chat-toggle-btn');
      if (chatToggle) {
        chatToggle.setAttribute('title', `Abrir Chat Box com ${currentPersonaName}`);
      }

      if (currentState === 'idle') {
        tooltip.textContent = `${currentPersonaName} — Online`;
      }

      updateThemeColor(currentAccentColor);
    } else {
      if (window.jarvis) {
        const result = await window.jarvis.getStatus();
        if (result && result.online) {
          tooltip.textContent = `${currentPersonaName} — Sincronia Local`;
        } else {
          currentState = 'idle';
          tooltip.textContent = `${currentPersonaName} — Offline`;
        }
      }
    }
  } catch (err) {
    console.error('Error fetching pet status:', err);
    currentState = 'idle';
    tooltip.textContent = `${currentPersonaName} — Offline`;
  }
}

pollStatus();
setInterval(pollStatus, 15000);

// === CONEXÃO SOCKET.IO COM O SERVER DO JESUS.AI ===
const socket = io('http://localhost:3000');

socket.on('connect', () => {
  console.log('[Socket] Conectado ao servidor do JesusAI');
  tooltip.textContent = `${currentPersonaName} — Sincronia Realtime Ativa`;
  pollStatus();
});

socket.on('disconnect', () => {
  console.warn('[Socket] Desconectado');
  currentState = 'idle';
  tooltip.textContent = `${currentPersonaName} — Desconectado`;
});

// Ouvintes de eventos cognitivos ao vivo do Jesus.AI!
socket.on('agent_thinking', (data) => {
  currentState = 'thinking';
  tooltip.textContent = `${currentPersonaName} — Processando...`;
});

socket.on('agent_speaking', (data) => {
  currentState = 'speaking';
  tooltip.textContent = `${currentPersonaName} — Falando...`;
});

socket.on('new_message', (data) => {
  if (data.sender === 'bot') {
    currentState = 'speaking';
    setTimeout(() => { if (currentState === 'speaking') currentState = 'idle'; }, 3000);
  }
});

// Eventos de Gamificação (XP e Badges) ao vivo!
socket.on('xp_update', (data) => {
  tooltip.textContent = `XP +${data.amount}! ${data.reason || ''}`;
  currentState = 'excited';
  setTimeout(() => { currentState = 'idle'; }, 4000);
});

socket.on('badge_earned', (data) => {
  tooltip.textContent = `🏆 BADGE GANHA: ${data.name || 'Conquistador'}`;
  currentState = 'excited';
  lightnings.push(createLightning());
  setTimeout(() => { currentState = 'idle'; }, 5000);
});

// Reação baseada na Análise Emocional (Cognitive State)
socket.on('cognitive_state', (state) => {
  const emotion = state?.emotion || 'neutral';
  console.log(`[Cognitive State] Emoção detectada no pet: ${emotion}`);
  
  if (emotion === 'frustrated' || emotion === 'angry') {
    currentState = 'frustrated';
    tooltip.textContent = `${currentPersonaName} — Tensão detectada...`;
  } else if (emotion === 'happy' || emotion === 'excited') {
    currentState = 'excited';
    tooltip.textContent = `${currentPersonaName} — Sinergia positiva!`;
  } else if (emotion === 'curious') {
    currentState = 'curious';
    tooltip.textContent = `${currentPersonaName} — Investigando tema...`;
  }
  
  setTimeout(() => { if (currentState === 'frustrated' || currentState === 'excited' || currentState === 'curious') currentState = 'idle'; }, 5000);
});



// === BOTÃO DO MIC — STT & Audio Recording ===
const micBtn = document.getElementById('mic-btn');
let micActive = false;
let mediaRecorder = null;
let audioChunks = [];

micBtn.addEventListener('mousedown', (e) => e.stopPropagation());
micBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  
  if (!micActive) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      
      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };
      
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(track => track.stop());
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        
        currentState = 'thinking';
        tooltip.textContent = `${currentPersonaName} — Processando voz...`;
        
        const formData = new FormData();
        formData.append('audio', audioBlob, 'pet_voice.webm');
        
        try {
          const res = await fetch('http://localhost:3000/api/pet/stt', {
            method: 'POST',
            body: formData
          });
          
          if (res.ok) {
            const data = await res.json();
            if (data.text && data.text.trim()) {
              chatInput.value = data.text;
              
              if (!chatOpen) {
                chatOpen = true;
                chatToggleBtn.classList.add('active');
                chatBox.classList.add('open');
                if (window.jarvis && typeof window.jarvis.toggleChat === 'function') {
                  window.jarvis.toggleChat(chatOpen);
                }
              }
              
              sendChatMessage();
            } else {
              currentState = 'idle';
              tooltip.textContent = `${currentPersonaName} — Não entendi o áudio.`;
              setTimeout(() => { tooltip.textContent = `${currentPersonaName} — Online`; }, 3000);
            }
          }
        } catch (err) {
          console.error('[Pet STT] Erro:', err);
          currentState = 'frustrated';
          tooltip.textContent = `${currentPersonaName} — Falha no STT.`;
          setTimeout(() => { currentState = 'idle'; }, 3000);
        }
      };
      
      mediaRecorder.start();
      micActive = true;
      micBtn.classList.add('active');
      micBtn.querySelector('svg').setAttribute('stroke', '#0f0');
      currentState = 'listening';
      tooltip.textContent = `${currentPersonaName} — Escutando...`;
      
    } catch (err) {
      console.error('[Pet Mic] Acesso negado:', err);
      tooltip.textContent = `Microfone bloqueado/indisponível`;
      setTimeout(() => { tooltip.textContent = `${currentPersonaName} — Online`; }, 3000);
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    micActive = false;
    micBtn.classList.remove('active');
    micBtn.querySelector('svg').setAttribute('stroke', 'var(--accent-color)');
  }
});

// === CONTROLE DO CHAT HOLOGRÁFICO ===
const chatToggleBtn = document.getElementById('chat-toggle-btn');
const chatBox = document.getElementById('chat-box');
const chatInput = document.getElementById('chat-input');
const chatSendBtn = document.getElementById('chat-send-btn');
const chatMessages = document.getElementById('chat-messages');

let chatOpen = false;
let currentAudio = null;

chatBox.addEventListener('mousedown', (e) => e.stopPropagation());
chatToggleBtn.addEventListener('mousedown', (e) => e.stopPropagation());

chatToggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  chatOpen = !chatOpen;
  chatToggleBtn.classList.toggle('active', chatOpen);
  chatBox.classList.toggle('open', chatOpen);
  
  if (chatOpen) {
    chatMessages.scrollTop = chatMessages.scrollHeight;
    setTimeout(() => chatInput.focus(), 150);
  }
  
  if (window.jarvis && typeof window.jarvis.toggleChat === 'function') {
    window.jarvis.toggleChat(chatOpen);
  }
});

chatSendBtn.addEventListener('click', sendChatMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    sendChatMessage();
  }
});

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  const userMsgDiv = document.createElement('div');
  userMsgDiv.className = 'msg user';
  userMsgDiv.textContent = text;
  chatMessages.appendChild(userMsgDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  chatInput.value = '';

  currentState = 'thinking';
  tooltip.textContent = `${currentPersonaName} — Processando...`;

  try {
    const chatRes = await fetch('http://localhost:3000/api/pet/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        personaId: currentPersonaId,
        language: currentLang
      })
    });

    if (!chatRes.ok) {
      throw new Error(`HTTP ${chatRes.status}`);
    }

    const chatData = await chatRes.json();
    const responseText = chatData.response;

    const jarvisMsgDiv = document.createElement('div');
    jarvisMsgDiv.className = `msg jarvis`;
    jarvisMsgDiv.textContent = responseText;
    chatMessages.appendChild(jarvisMsgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    if (chatData.personaId) currentPersonaId = chatData.personaId;
    if (chatData.personaName) {
      currentPersonaName = chatData.personaName;
      const headerTitle = document.querySelector('#chat-header h3');
      if (headerTitle) {
        headerTitle.textContent = `${currentPersonaName.toUpperCase()} CLASSIC CO-COMPANION`;
      }
    }

    // Play pre-generated Base64 audio instantly to eliminate delay!
    if (chatData.audioDataUrl) {
      const audio = new Audio(chatData.audioDataUrl);
      currentAudio = audio;

      audio.onplay = () => {
        currentState = 'speaking';
        tooltip.textContent = `${currentPersonaName} — Transmitindo áudio...`;
      };

      audio.onended = () => {
        currentState = 'idle';
        tooltip.textContent = `${currentPersonaName} — Pronto, Senhor.`;
        currentAudio = null;
      };

      audio.onerror = () => {
        currentState = 'idle';
        tooltip.textContent = `${currentPersonaName} — Sincronia Realtime`;
        currentAudio = null;
      };

      await audio.play();
    } else {
      // Fallback: second request network roundtrip if not pre-generated
      const voice = chatData.ttsVoice || currentVoice;
      const lang = chatData.ttsLang || chatData.language || currentLang;

      currentState = 'thinking';
      tooltip.textContent = `${currentPersonaName} — Sintetizando voz...`;

      try {
        const ttsRes = await fetch('http://localhost:3000/api/pet/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: responseText,
            voice: voice,
            lang: lang
          })
        });

        if (ttsRes.ok) {
          const audioBlob = await ttsRes.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          const audio = new Audio(audioUrl);
          currentAudio = audio;

          audio.onplay = () => {
            currentState = 'speaking';
            tooltip.textContent = `${currentPersonaName} — Transmitindo áudio...`;
          };

          audio.onended = () => {
            currentState = 'idle';
            tooltip.textContent = `${currentPersonaName} — Pronto, Senhor.`;
            currentAudio = null;
          };

          audio.onerror = () => {
            currentState = 'idle';
            tooltip.textContent = `${currentPersonaName} — Sincronia Realtime`;
            currentAudio = null;
          };

          await audio.play();
        } else {
          throw new Error('TTS fetch returned non-200');
        }
      } catch (err) {
        console.warn('[Pet] Falha no TTS, degradando para resposta silenciosa:', err.message);
        currentState = 'idle';
        tooltip.textContent = `${currentPersonaName} — Pronto, Senhor.`;
      }
    }

  } catch (err) {
    console.error('[Pet] Erro de rede ou chat:', err);
    currentState = 'frustrated';
    tooltip.textContent = `${currentPersonaName} — Erro de comunicação`;

    const errDiv = document.createElement('div');
    errDiv.className = 'msg jarvis';
    errDiv.style.color = '#f87171';
    errDiv.style.border = '1px solid rgba(248, 113, 113, 0.4)';
    errDiv.textContent = `Desculpe, Senhor. Não consegui conectar com meus sistemas centrais.`;
    chatMessages.appendChild(errDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    setTimeout(() => {
      if (currentState === 'frustrated') {
        currentState = 'idle';
        tooltip.textContent = `${currentPersonaName} — Online`;
      }
    }, 5000);
  }
}

// === DRAG & DROP via Electron Bridge ===
let isDragging = false;
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 0) {
    isDragging = true;
    canvas.style.cursor = 'grabbing';
    if (window.jarvis) window.jarvis.startDrag(e.screenX, e.screenY);
  }
});
document.addEventListener('mousemove', (e) => {
  if (isDragging && window.jarvis) window.jarvis.onDrag(e.screenX, e.screenY);
});
document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    canvas.style.cursor = 'grab';
    if (window.jarvis) window.jarvis.stopDrag();
  }
});

// Double click -> abre cockpit
canvas.addEventListener('dblclick', () => {
  if (window.jarvis) window.jarvis.openCockpit();
});

// Right click -> abre menu
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (window.jarvis) window.jarvis.showMenu();
});
</script>
